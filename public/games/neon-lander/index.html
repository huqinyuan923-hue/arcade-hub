<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>霓虹登月</title>
<script src="/games/_bridge.js"></script>
<script src="/games/_audio.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#0d0b1e;color:#e7e6f5;font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:10px;padding:10px;}
  h1{color:#a855f7;text-shadow:0 0 10px rgba(168,85,247,.6);font-size:22px;letter-spacing:2px;}
  .hud{display:flex;gap:14px;font-size:14px;color:#94a3b8;flex-wrap:wrap;justify-content:center;}
  .hud b{color:#facc15;font-size:17px;}
  canvas{background:#120f28;border:1px solid rgba(168,85,247,.3);border-radius:10px;max-width:92vw;touch-action:none;}
  .pads{display:none;gap:8px;}
  @media (pointer:coarse){.pads{display:flex;}}
  .pads button{width:64px;height:52px;font-size:20px;background:#1a1630;color:#e7e6f5;border:1px solid #2e2a55;border-radius:10px;}
  p.tip{color:#64748b;font-size:12px;text-align:center;}
</style>
</head>
<body>
<h1>🚀 霓虹登月</h1>
<div class="hud">
  <span>分数 <b id="score">0</b></span>
  <span>关卡 <b id="level">1</b></span>
  <span>燃料 <b id="fuel">100</b></span>
  <span>生命 <b id="lives">3</b></span>
  <span>最高 <b id="hi">0</b></span>
</div>
<canvas id="cv" width="480" height="520"></canvas>
<div class="pads"><button id="pL">↺</button><button id="pT">🔥</button><button id="pR">↻</button></div>
<p class="tip">←→ 旋转 · ↑/空格 点火 · 平台越窄分越高 · 落地要缓（速度 &lt; 2.2、倾角 &lt; 25°）· 剩余燃料折算加分</p>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const W=cv.width,H=cv.height;
let lander,terrain,pads,parts,stars,score,level,lives,fuel,dead,started,frame,raf,landed;
let hi=+(localStorage.getItem('alander_hi')||0);
document.getElementById('hi').textContent=hi;
const keys={left:false,right:false,thrust:false};

function genTerrain(){
  // 从左到右单调推进的折线月面；平台 = 同高的相邻双点（保证 x 单调，不产生穿透区）
  terrain=[];pads=[];
  let x=0,y=H-70-Math.random()*60;
  const padAt=[0.16+Math.random()*0.14, 0.55+Math.random()*0.18]; // 两块平台的相对位置
  let padIdx=0;
  while(x<W-40){
    if(padIdx<padAt.length&&x>W*padAt[padIdx]){
      const wide=padIdx===0;
      const wid=wide?64:34, py=H-64;
      const end=x+wid;
      terrain.push({x,y:py},{x:end,y:py});
      pads.push({x1:x,x2:end,y:py,w:wid,mult:wide?1:2.5});
      x=end+20;y=py;padIdx++;
      continue;
    }
    y=Math.max(H-160,Math.min(H-56,y+(Math.random()-0.5)*50));
    terrain.push({x,y});
    x+=16+Math.random()*26;
  }
  terrain.push({x:W,y:H-80});
  stars=Array.from({length:46},()=>({x:Math.random()*W,y:Math.random()*(H-200),s:.2+Math.random()*.5}));
}
function newGame(){
  score=0;level=1;lives=3;dead=false;started=false;frame=0;landed=false;
  lastTs=0;acc=0;
  resetLevel();hud();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop);
}
function resetLevel(){
  genTerrain();
  lander={x:40+Math.random()*60,y:70,vx:0.35+level*0.12,vy:0,a:-Math.PI/2,fuel:100};
  parts=[];landed=false;
}
function hud(){document.getElementById('score').textContent=score;document.getElementById('level').textContent=level;document.getElementById('fuel').textContent=Math.ceil(lander?lander.fuel:0);document.getElementById('lives').textContent=lives;}
function start(){if(started||dead)return;started=true;ArcadeAudio.bgm('pulse');}
function boom(x,y,color,n){for(let i=0;i<n;i++)parts.push({x,y,vx:(Math.random()-0.5)*3.5,vy:(Math.random()-0.5)*3.5,life:24,c:color});}
function die(){
  lives--;dead=true;ArcadeAudio.bgm(null);ArcadeAudio.sfx('over');boom(lander.x,lander.y,'#fb7185',26);
  if(score>hi){hi=score;localStorage.setItem('alander_hi',hi);document.getElementById('hi').textContent=hi;}
  ArcadeBridge.submitScore(score);
  setTimeout(()=>{dead=false;if(lives>0){resetLevel();started=false;hud();}else newGame();},1700);
}
function touchdown(pad){
  // 剩余燃料折算 + 平台倍率 + 关卡系数
  const bonus=Math.round(lander.fuel*2*pad.mult*(1+ (level-1)*0.25));
  score+=Math.round(100*pad.mult)+bonus;
  ArcadeAudio.sfx('level');boom(lander.x,pad.y,'#a3e635',16);
  landed=true;
  setTimeout(()=>{level++;resetLevel();started=true;hud();},1400);
}
function terrainY(x){
  for(let i=0;i<terrain.length-1;i++){
    const a=terrain[i],b=terrain[i+1];
    if(x>=a.x&&x<=b.x)return a.y+(b.y-a.y)*((x-a.x)/(b.x-a.x||1));
  }
  return H;
}
// 调试用自动驾驶（URL 带 ?autopilot=1 开启）：按真实内部状态算输入，
// 用于回归验证着陆/计分/过关分支，不参与正常游玩。
const AUTOPILOT=new URLSearchParams(location.search).has('autopilot');
function autopilot(L){
  keys.left=keys.right=keys.thrust=false;
  let pad=pads[0],best=1e9;
  for(const p of pads){const d=Math.abs((p.x1+p.x2)/2-L.x);if(d<best){best=d;pad=p;}}
  const ty=terrainY(L.x),alt=ty-9-L.y;
  const cx=(pad.x1+pad.x2)/2,dx=cx-L.x;
  const wantVx=Math.abs(dx)<20?0:Math.sign(dx)*Math.min(0.6,Math.abs(dx)*0.02);
  const wantVy=alt>160?1.4:alt>60?0.8:0.35;
  // 期望加速度（比例控制）
  let ax=(wantVx-L.vx)*0.06,ay=(wantVy-L.vy)*0.06+0.026;
  if(alt<26){ // 最终进近：强制竖直
    const na=((L.a%(Math.PI*2))+Math.PI*2)%(Math.PI*2);
    const tilt=Math.abs(na-3*Math.PI/2);
    if(tilt>0.02){keys.left=tilt>0&&na>3*Math.PI/2;keys.right=!keys.left;return;}
    keys.thrust=L.vy>wantVy&&L.fuel>0;
    return;
  }
  const wantA=Math.atan2(ay,ax);
  const mag=Math.hypot(ax,ay);
  if(mag>0.012&&L.fuel>0){
    // 朝 wantA 旋转（取最短角差方向）
    let diff=wantA-L.a;
    while(diff>Math.PI)diff-=Math.PI*2;
    while(diff<-Math.PI)diff+=Math.PI*2;
    if(Math.abs(diff)>0.06){keys.left=diff<0;keys.right=diff>0;}
    else keys.thrust=true;
  }else{
    // 无需推进：回正
    const na=((L.a%(Math.PI*2))+Math.PI*2)%(Math.PI*2);
    const tilt=Math.abs(na-3*Math.PI/2);
    if(tilt>0.02){keys.left=na>3*Math.PI/2;keys.right=!keys.left;}
  }
}
function update(){
  frame++;
  if(!started||dead||landed)return;
  const L=lander;
  if(AUTOPILOT)autopilot(L);
  if(keys.left)L.a-=0.055;
  if(keys.right)L.a+=0.055;
  if(keys.thrust&&L.fuel>0){
    L.vx+=Math.cos(L.a)*0.075;L.vy+=Math.sin(L.a)*0.075;
    L.fuel=Math.max(0,L.fuel-0.28);
    if(frame%3===0)parts.push({x:L.x-Math.cos(L.a)*10,y:L.y-Math.sin(L.a)*10,vx:(Math.random()-.5)*1.4,vy:1.2+Math.random(),life:14,c:'#fb923c'});
  }
  L.vy+=0.026; // 微重力
  L.x+=L.vx;L.y+=L.vy;
  hud();
  const ty=terrainY(L.x);
  if(L.x<8||L.x>W-8||L.y<6){die();return;}
  if(L.y+9>=ty){
    // 判定：速度、倾角（相对竖直朝上）、是否平台
    const speed=Math.hypot(L.vx,L.vy);
    const na=((L.a%(Math.PI*2))+Math.PI*2)%(Math.PI*2);
    const tilt=Math.abs(na-3*Math.PI/2); // -π/2 归一化到 3π/2
    const pad=pads.find(p=>L.x>=p.x1-4&&L.x<=p.x2+4);
    if(pad&&speed<2.2&&tilt<0.44){
      L.y=ty-9;L.vx=L.vy=0;touchdown(pad);
    }else{die();}
    return;
  }
}
function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#ffffff88';
  for(const s of stars)ctx.fillRect(s.x,s.y,s.s>0.5?2:1,s.s>0.5?2:1);
  // 地形
  ctx.beginPath();ctx.moveTo(0,H);
  for(const t of terrain)ctx.lineTo(t.x,t.y);
  ctx.lineTo(W,H);ctx.closePath();
  ctx.fillStyle='#1c1533';ctx.fill();
  ctx.strokeStyle='#a855f7';ctx.lineWidth=2;ctx.shadowColor='#a855f7';ctx.shadowBlur=6;ctx.stroke();
  ctx.shadowBlur=0;
  for(const p of pads){
    ctx.strokeStyle=p.mult>1?'#a3e635':'#22d3ee';ctx.lineWidth=3;
    ctx.shadowColor=ctx.strokeStyle;ctx.shadowBlur=8;
    ctx.beginPath();ctx.moveTo(p.x1,p.y);ctx.lineTo(p.x2,p.y);ctx.stroke();
    ctx.shadowBlur=0;
    ctx.fillStyle=ctx.strokeStyle;ctx.font='11px system-ui';ctx.textAlign='center';
    ctx.fillText(p.mult>1?'×2.5':'×1',(p.x1+p.x2)/2,p.y+16);
  }
  for(const p of parts){ctx.globalAlpha=p.life/26;ctx.fillStyle=p.c;ctx.fillRect(p.x-1.5,p.y-1.5,3,3);}
  ctx.globalAlpha=1;
  if(!dead&&lander){
    const L=lander;
    ctx.save();ctx.translate(L.x,L.y);ctx.rotate(L.a);
    ctx.beginPath();ctx.moveTo(10,0);ctx.lineTo(-8,-8);ctx.lineTo(-4,0);ctx.lineTo(-8,8);ctx.closePath();
    ctx.strokeStyle='#f472b6';ctx.shadowColor='#f472b6';ctx.shadowBlur=10;ctx.lineWidth=2;ctx.stroke();
    if(keys.thrust&&L.fuel>0&&started&&!landed){ctx.beginPath();ctx.moveTo(-7,0);ctx.lineTo(-15-Math.random()*6,0);ctx.strokeStyle='#fb923c';ctx.stroke();}
    ctx.restore();ctx.shadowBlur=0;
    // 速度表
    const speed=Math.hypot(L.vx,L.vy);
    ctx.fillStyle=speed<2.2?'#a3e635':'#fb7185';
    ctx.font='12px system-ui';ctx.textAlign='left';
    ctx.fillText('速度 '+speed.toFixed(2)+(speed<2.2?' ✓':' ✗'),12,H-14);
  }
  if(!started&&!dead){ctx.fillStyle='#94a3b8';ctx.font='14px system-ui';ctx.textAlign='center';ctx.fillText('按方向键 / 点击 开始',W/2,H/2);}
  if(landed){ctx.fillStyle='#a3e635';ctx.font='20px system-ui';ctx.textAlign='center';ctx.fillText('着陆成功！下一关…',W/2,H/2-30);}
  if(dead){ctx.fillStyle='#f472b6';ctx.font='20px system-ui';ctx.textAlign='center';ctx.fillText('坠毁… '+score+' 分',W/2,H/2);}
}
// 固定 60Hz 物理步长：高刷屏（120/144/300fps）上难度与 60Hz 屏一致
let lastTs=0,acc=0;
function loop(ts){
  if(!lastTs)lastTs=ts;
  acc+=Math.min(ts-lastTs,100);lastTs=ts;
  while(acc>=1000/60){update();acc-=1000/60;}
  draw();
  raf=requestAnimationFrame(loop);
}
addEventListener('keydown',e=>{
  if(['ArrowLeft','a','A'].includes(e.key)){keys.left=true;start();}
  if(['ArrowRight','d','D'].includes(e.key)){keys.right=true;start();}
  if(['ArrowUp','w','W',' '].includes(e.key)){keys.thrust=true;start();e.preventDefault();}
});
addEventListener('keyup',e=>{
  if(['ArrowLeft','a','A'].includes(e.key))keys.left=false;
  if(['ArrowRight','d','D'].includes(e.key))keys.right=false;
  if(['ArrowUp','w','W',' '].includes(e.key))keys.thrust=false;
});
cv.addEventListener('pointerdown',()=>start());
const bind=(id,k)=>{const el=document.getElementById(id);
  el.addEventListener('pointerdown',e=>{keys[k]=true;start();e.preventDefault();});
  el.addEventListener('pointerup',()=>keys[k]=false);
  el.addEventListener('pointerleave',()=>keys[k]=false);};
bind('pL','left');bind('pR','right');bind('pT','thrust');
newGame();
</script>
</body>
</html>
