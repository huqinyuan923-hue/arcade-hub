<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>四子连线</title>
<script src="/games/_bridge.js"></script>
<script src="/games/_audio.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box;user-select:none;}
  body{background:#0d0b1e;color:#e7e6f5;font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:12px;padding:10px;}
  h1{color:#22d3ee;text-shadow:0 0 10px rgba(34,211,238,.7);font-size:22px;letter-spacing:2px;}
  .hud{display:flex;gap:16px;font-size:14px;color:#94a3b8;}
  .hud b{color:#facc15;font-size:17px;}
  canvas{background:#1a1633;border:1px solid rgba(34,211,238,.4);border-radius:12px;max-width:92vw;cursor:pointer;}
  #status{font-size:15px;color:#94a3b8;min-height:22px;}
  button{background:linear-gradient(135deg,rgba(34,211,238,.2),rgba(167,139,250,.2));border:1px solid #22d3ee;color:#d9fbff;padding:8px 22px;border-radius:10px;cursor:pointer;}
</style>
</head>
<body>
<h1>🔴 四子连线</h1>
<div class="hud"><span>你 🔵 / AI 🔴</span><span>连胜 <b id="streak">0</b></span></div>
<canvas id="cv" width="490" height="420"></canvas>
<p id="status">点击列投入棋子，横竖斜连成 4 子即胜</p>
<button id="btnNew">重新开始</button>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const C=7,R=6,S=70;
let board,playing,me=true,winCells,streak=0;
const DIRS=[[1,0],[0,1],[1,1],[1,-1]];

function newGame(){
  board=Array.from({length:R},()=>Array(C).fill(0)); // 0空 1玩家 2AI
  playing=true;me=true;winCells=null;
  document.getElementById('status').textContent='点击列投入棋子，横竖斜连成 4 子即胜';
  draw();
}
function dropRow(c){
  for(let r=R-1;r>=0;r--)if(board[r][c]===0)return r;
  return -1;
}
function checkWin(p){
  for(let r=0;r<R;r++)for(let c=0;c<C;c++){
    if(board[r][c]!==p)continue;
    for(const [dx,dy] of DIRS){
      const cells=[[c,r]];
      let nx=c+dx,ny=r+dy;
      while(nx>=0&&nx<C&&ny>=0&&ny<R&&board[ny][nx]===p){cells.push([nx,ny]);nx+=dx;ny+=dy;}
      if(cells.length>=4)return cells;
    }
  }
  return null;
}
function place(c,p){
  const r=dropRow(c);
  if(r<0)return false;
  board[r][c]=p;
  ArcadeAudio.sfx('click');
  draw();
  const w=checkWin(p);
  if(w){
    winCells=w;playing=false;
    const win=p===1;
    ArcadeAudio.stopBgm();
    ArcadeAudio.sfx(win?'win':'over');
    if(win){streak++;}else streak=0;
    document.getElementById('streak').textContent=streak;
    ArcadeBridge.submitScore(win?100+streak*50:20);
    document.getElementById('status').textContent=win?`🏆 你赢了！连胜 ${streak}`:'🔴 AI 赢了';
    draw();
    return true;
  }
  return false;
}
function aiMove(){
  // 评分：能赢>必须堵>中心偏好
  for(const p of [2,1]){
    for(let c=0;c<C;c++){
      const r=dropRow(c);
      if(r<0)continue;
      board[r][c]=p;
      const w=checkWin(p);
      board[r][c]=0;
      if(w)return place(c,2);
    }
  }
  const pref=[3,2,4,1,5,0,6].find(c=>dropRow(c)>=0);
  if(pref!==undefined)place(pref,2);
}
cv.addEventListener('click',e=>{
  if(!playing||!me)return;
  const r=cv.getBoundingClientRect();
  const c=Math.floor((e.clientX-r.left)*(C/r.width));
  if(c<0||c>=C||dropRow(c)<0)return;
  if(place(c,1))return;
  me=false;
  document.getElementById('status').textContent='🔴 AI 思考中…';
  setTimeout(()=>{aiMove();if(playing){me=true;document.getElementById('status').textContent='轮到你了';}},420);
});
document.getElementById('btnNew').addEventListener('click',()=>{ArcadeAudio.sfx('move');newGame();});
function draw(){
  ctx.fillStyle='#1a1633';ctx.fillRect(0,0,cv.width,cv.height);
  for(let r=0;r<R;r++)for(let c=0;c<C;c++){
    ctx.beginPath();ctx.arc(c*S+S/2,r*S+S/2,S/2-6,0,7);
    ctx.fillStyle='#0d0b1e';ctx.fill();
    const v=board[r][c];
    if(v){
      ctx.beginPath();ctx.arc(c*S+S/2,r*S+S/2,S/2-8,0,7);
      ctx.fillStyle=v===1?'#22d3ee':'#f87171';
      ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=10;ctx.fill();
    }
  }
  ctx.shadowBlur=0;
  if(winCells){
    ctx.strokeStyle='#facc15';ctx.lineWidth=5;
    ctx.beginPath();
    winCells.slice(0,4).forEach(([c,r],i)=>{
      i?ctx.lineTo(c*S+S/2,r*S+S/2):ctx.moveTo(c*S+S/2,r*S+S/2);
    });
    ctx.stroke();
  }
}
newGame();
ArcadeAudio.bgm('march');
</script>
</body>
</html>
