<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>霓虹跳跳</title>
<script src="/games/_bridge.js"></script>
<script src="/games/_audio.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#0d0b1e;color:#e7e6f5;font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:10px;padding:10px;}
  h1{color:#a3e635;text-shadow:0 0 10px rgba(163,230,53,.6);font-size:22px;letter-spacing:2px;}
  .hud{display:flex;gap:16px;font-size:14px;color:#94a3b8;}
  .hud b{color:#facc15;font-size:17px;}
  canvas{background:#060414;border:1px solid rgba(163,230,53,.4);border-radius:10px;max-width:92vw;touch-action:none;}
  p.tip{color:#64748b;font-size:12px;}
</style>
</head>
<body>
<h1>🦘 霓虹跳跳</h1>
<div class="hud"><span>高度 <b id="score">0</b></span><span>最高 <b id="hi">0</b></span></div>
<canvas id="cv" width="400" height="520"></canvas>
<p class="tip">←→ / A D / 左右倾斜 移动 · 自动弹跳 · 落到弹床上越跳越高 · 掉出屏幕底部结束</p>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const W=400,H=520;
let hero,plats,score,best,dead,started,camY,frame,raf,keys={};
let hi=+(localStorage.getItem('ajumphi')||0);
document.getElementById('hi').textContent=hi;

function newGame(){
  hero={x:W/2,y:H-80,vy:-13,r:12};
  plats=[{x:W/2-50,y:H-50,w:100,type:'n'}];
  // 预生成向上的平台
  for(let i=1;i<40;i++){
    plats.push({x:Math.random()*(W-90),y:H-50-i*72,w:60+Math.random()*40,type:Math.random()<0.12?'m':'n'});
  }
  score=0;dead=false;started=false;camY=0;frame=0;
  document.getElementById('score').textContent=0;
  cancelAnimationFrame(raf);loop();
  ctx.fillStyle='#94a3b8';ctx.font='14px system-ui';ctx.textAlign='center';
  ctx.fillText('左右移动开始（自动弹跳）',W/2,H/2);
}
function addPlats(topY){
  let lastY=topY;
  while(lastY>camY-200){
    lastY-=72+Math.random()*30;
    plats.push({x:Math.random()*(W-90),y:lastY,w:60+Math.random()*40,type:Math.random()<0.12?'m':'n'});
  }
}
function update(){
  frame++;
  if(!started)return;
  // 水平移动
  if(keys.left)hero.x-=5;
  if(keys.right)hero.x+=5;
  if(hero.x<-10)hero.x=W+10;
  if(hero.x>W+10)hero.x=-10;
  // 物理
  hero.vy+=0.42;
  hero.y+=hero.vy;
  // 落板判定（下落时）
  if(hero.vy>0){
    for(const p of plats){
      if(hero.x>p.x-8&&hero.x<p.x+p.w+8&&hero.y+hero.r>=p.y&&hero.y+hero.r<=p.y+16){
        hero.vy=p.type==='m'?-19:-13.5;
        ArcadeAudio.sfx('jump');
        if(p.type==='m'){plats=plats.filter(q=>q!==p);}
        break;
      }
    }
  }
  // 相机跟随（只上不下）
  const target=hero.y-H*0.55;
  if(target<camY)camY+=(target-camY)*0.12;
  // 计分
  const height=Math.floor((H-80-hero.y-camY)/10);
  if(height>score){score=Math.max(0,height);document.getElementById('score').textContent=score;}
  // 生成新平台
  addPlats(plats.reduce((m,p)=>Math.min(m,p.y),0));
  // 清理屏幕外
  plats=plats.filter(p=>p.y<camY+H+60);
  // 死亡：掉出视野底部
  if(hero.y-camY>H+30){
    dead=true;
    ArcadeAudio.stopBgm();
    ArcadeAudio.sfx('over');
    if(score>hi){hi=score;localStorage.setItem('ajumphi',hi);document.getElementById('hi').textContent=hi;}
    ArcadeBridge.submitScore(score);
    ctx.fillStyle='rgba(6,4,20,.85)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#f472b6';ctx.font='bold 24px system-ui';ctx.textAlign='center';
    ctx.fillText(`坠落！高度 ${score}`,W/2,H/2-10);
    ctx.fillStyle='#94a3b8';ctx.font='14px system-ui';
    ctx.fillText('移动一下再来一局',W/2,H/2+20);
    const re=()=>{removeEventListener('keydown',rk);newGame();};
    const rk=e=>{if(e.key.startsWith('Arrow')){removeEventListener('keydown',rk);newGame();}};
    setTimeout(()=>{addEventListener('keydown',rk);cv.addEventListener('mousemove',re,{once:true});},400);
  }
}
function draw(){
  ctx.fillStyle='#060414';ctx.fillRect(0,0,W,H);
  // 星星（视差）
  ctx.fillStyle='rgba(148,163,255,.3)';
  for(let i=0;i<30;i++){
    const sx=(i*127)%W,sy=((i*211)-camY*0.3)%(H+40);
    if(sy>0)ctx.fillRect(sx,sy,1.5,1.5);
  }
  plats.forEach(p=>{
    ctx.fillStyle=p.type==='m'?'#f472b6':'#a3e635';
    ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=8;
    ctx.beginPath();ctx.roundRect(p.x,p.y-camY,p.w,10,5);ctx.fill();
  });
  ctx.shadowBlur=0;
  // 小球
  const sy=hero.y-camY;
  if(sy>-20&&sy<H+20){
    ctx.beginPath();ctx.arc(hero.x,sy,hero.r,0,7);
    ctx.fillStyle='#22d3ee';ctx.shadowColor='#22d3ee';ctx.shadowBlur=14;ctx.fill();
    ctx.shadowBlur=0;
  }
}
function loop(){
  update();draw();
  raf=requestAnimationFrame(loop);
}
addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft'||e.key==='a'){keys.left=true;started=true;ArcadeAudio.bgm('march');e.preventDefault();}
  if(e.key==='ArrowRight'||e.key==='d'){keys.right=true;started=true;ArcadeAudio.bgm('march');e.preventDefault();}
});
addEventListener('keyup',e=>{
  if(e.key==='ArrowLeft'||e.key==='a')keys.left=false;
  if(e.key==='ArrowRight'||e.key==='d')keys.right=false;
});
function tilt(e){
  const r=cv.getBoundingClientRect();
  const x=(e.clientX-r.left)*(W/r.width);
  if(x<W/2-30){keys.left=true;keys.right=false;}
  else if(x>W/2+30){keys.right=true;keys.left=false;}
  else{keys.left=false;keys.right=false;}
  started=true;
}
cv.addEventListener('mousemove',e=>{if(started)tilt(e);});
cv.addEventListener('touchmove',e=>{e.preventDefault();tilt(e.touches[0]);},{passive:false});
newGame();
</script>
</body>
</html>
