<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>霓虹贪吃蛇</title>
<script src="/games/_bridge.js"></script>
<script src="/games/_audio.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#0d0b1e;color:#e7e6f5;font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:10px;padding:10px;}
  h1{color:#22d3ee;text-shadow:0 0 10px rgba(34,211,238,.7);font-size:24px;letter-spacing:2px;}
  .hud{display:flex;gap:16px;font-size:14px;color:#94a3b8;}
  .hud b{color:#facc15;font-size:18px;}
  canvas{background:#120f28;border:1px solid rgba(34,211,238,.3);border-radius:10px;max-width:92vw;}
  .pad{display:grid;grid-template:repeat(2,52px)/repeat(3,52px);gap:6px;}
  .pad button{background:rgba(124,58,237,.2);border:1px solid rgba(167,139,250,.5);color:#ddd6fe;border-radius:10px;font-size:20px;cursor:pointer;}
  button.restart{background:linear-gradient(135deg,rgba(34,211,238,.2),rgba(167,139,250,.2));border:1px solid #22d3ee;color:#d9fbff;padding:8px 22px;border-radius:10px;cursor:pointer;}
</style>
</head>
<body>
<h1>🐍 霓虹贪吃蛇</h1>
<div class="hud"><span>分数 <b id="score">0</b></span><span>最高 <b id="hi">0</b></span></div>
<canvas id="cv" width="400" height="400"></canvas>
<div class="modes" style="display:flex;gap:8px;">
  <button data-v="170" style="background:rgba(124,58,237,.2);border:1px solid rgba(167,139,250,.5);color:#ddd6fe;border-radius:8px;padding:4px 14px;cursor:pointer;font-size:12px;">🐢 慢速</button>
  <button data-v="140" class="on" style="background:rgba(124,58,237,.2);border:1px solid #22d3ee;color:#d9fbff;border-radius:8px;padding:4px 14px;cursor:pointer;font-size:12px;">🚶 普通</button>
  <button data-v="95" style="background:rgba(124,58,237,.2);border:1px solid rgba(167,139,250,.5);color:#ddd6fe;border-radius:8px;padding:4px 14px;cursor:pointer;font-size:12px;">🐇 疾速</button>
</div>
<div class="pad">
  <span></span><button data-d="u">▲</button><span></span>
  <button data-d="l">◀</button><button data-d="d">▼</button><button data-d="r">▶</button>
</div>
<p style="color:#64748b;font-size:12px">方向键 / WASD / 按钮 控制 · 撞墙或咬到自己结束</p>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const N=20,S=cv.width/N;
let snake,dir,food,score,dead,timer,speed,baseSpeed;
let hi=+(localStorage.getItem('asnakehi')||0);
document.getElementById('hi').textContent=hi;

function newGame(){
  snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];
  dir={x:1,y:0};score=0;dead=false;baseSpeed=+document.querySelector('.modes .on').dataset.v;speed=baseSpeed;
  placeFood();
  document.querySelector('.restart')?.remove();
  clearInterval(timer);timer=setInterval(tick,speed);
  ArcadeAudio.bgm('pulse');
  draw();
}
function placeFood(){
  do{food={x:Math.random()*N|0,y:Math.random()*N|0};}
  while(snake.some(s=>s.x===food.x&&s.y===food.y));
}
function setDir(d){
  const m={u:{x:0,y:-1},d:{x:0,y:1},l:{x:-1,y:0},r:{x:1,y:0}}[d];
  if(m&&(m.x!==-dir.x||m.y!==-dir.y))dir=m;
}
function tick(){
  const head={x:(snake[0].x+dir.x+N)%N,y:(snake[0].y+dir.y+N)%N};
  // 撞墙判定（穿墙改为撞墙）：用边界
  head.x=snake[0].x+dir.x;head.y=snake[0].y+dir.y;
  if(head.x<0||head.x>=N||head.y<0||head.y>=N||snake.some(s=>s.x===head.x&&s.y===head.y)){return die();}
  snake.unshift(head);
  if(head.x===food.x&&head.y===food.y){
    score+=10;document.getElementById('score').textContent=score;
    ArcadeAudio.sfx('eat');
    placeFood();
    if(score%50===0){clearInterval(timer);speed=Math.max(60,baseSpeed-(score/50)*15);timer=setInterval(tick,speed);ArcadeAudio.sfx('levelup');}
  }else snake.pop();
  draw();
}
function die(){
  dead=true;clearInterval(timer);
  ArcadeAudio.stopBgm();
  ArcadeAudio.sfx('over');
  ArcadeBridge.submitScore(score);
  const o=document.createElement('button');o.className='restart';o.textContent='💀 游戏结束 · 点击重来（'+score+'分）';o.onclick=newGame;
  document.body.appendChild(o);
}
function draw(){
  ctx.fillStyle='#120f28';ctx.fillRect(0,0,cv.width,cv.height);
  ctx.strokeStyle='rgba(124,58,237,.12)';
  for(let i=1;i<N;i++){ctx.beginPath();ctx.moveTo(i*S,0);ctx.lineTo(i*S,cv.height);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i*S);ctx.lineTo(cv.width,i*S);ctx.stroke();}
  ctx.shadowColor='#f472b6';ctx.shadowBlur=12;
  ctx.fillStyle='#f472b6';
  ctx.beginPath();ctx.arc(food.x*S+S/2,food.y*S+S/2,S/2-2,0,7);ctx.fill();
  snake.forEach((s,i)=>{
    ctx.shadowColor=i?'#22d3ee':'#a3e635';ctx.shadowBlur=10;
    ctx.fillStyle=i?`rgba(34,211,238,${1-i/snake.length*.6})`:'#a3e635';
    ctx.beginPath();ctx.roundRect(s.x*S+1.5,s.y*S+1.5,S-3,S-3,4);ctx.fill();
  });
  ctx.shadowBlur=0;
}
addEventListener('keydown',e=>{
  const map={ArrowUp:'u',ArrowDown:'d',ArrowLeft:'l',ArrowRight:'r',w:'u',s:'d',a:'l',d:'r'};
  if(map[e.key]){e.preventDefault();setDir(map[e.key]);}
});
document.querySelectorAll('.pad button').forEach(b=>b.addEventListener('click',()=>setDir(b.dataset.d)));
document.querySelectorAll('.modes button').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.modes button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');
  ArcadeAudio.sfx('move');
  newGame();
}));
newGame();
</script>
</body>
</html>
