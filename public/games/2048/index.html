<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>2048</title>
<script src="/games/_bridge.js"></script>
<script src="/games/_audio.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; touch-action:none; }
  body { background:#0d0b1e; color:#e7e6f5; font-family:system-ui,sans-serif; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; gap:12px; padding:12px; }
  h1 { color:#22d3ee; text-shadow:0 0 10px rgba(34,211,238,.7); font-size:26px; letter-spacing:2px; }
  .hud { display:flex; gap:12px; font-size:14px; color:#94a3b8; }
  .hud b { color:#facc15; font-size:18px; }
  #board { position:relative; width:min(92vw,420px); aspect-ratio:1; background:#1a1633; border-radius:12px; padding:8px; }
  .grid { display:grid; grid-template:repeat(4,1fr)/repeat(4,1fr); gap:8px; width:100%; height:100%; }
  .cell { background:#221d44; border-radius:8px; }
  .tile { position:absolute; display:flex; align-items:center; justify-content:center; border-radius:8px; font-weight:800; transition:all .12s ease; }
  .over { position:absolute; inset:0; background:rgba(7,5,16,.82); border-radius:12px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; }
  .over p { font-size:20px; color:#f472b6; text-shadow:0 0 10px rgba(244,114,182,.6); }
  button { background:linear-gradient(135deg,rgba(34,211,238,.2),rgba(167,139,250,.2)); border:1px solid #22d3ee; color:#d9fbff; padding:8px 22px; border-radius:10px; cursor:pointer; font-size:14px; }
</style>
</head>
<body>
<h1>2048</h1>
<div class="hud"><span>分数 <b id="score">0</b></span><span>最高 <b id="hi">0</b></span><button class="undo" style="background:rgba(124,58,237,.2);border:1px solid rgba(167,139,250,.5);color:#ddd6fe;border-radius:8px;padding:2px 10px;cursor:pointer;font-size:12px;">↩ 撤销</button></div>
<div id="board"><div class="grid" id="grid"></div></div>
<p style="color:#64748b;font-size:12px">方向键 / WASD / 滑动屏幕 移动方块 · 相同数字合并</p>
<script>
const board=document.getElementById('board'),grid=document.getElementById('grid');
for(let i=0;i<16;i++){const c=document.createElement('div');c.className='cell';grid.appendChild(c);}
let tiles,score,hi=+(localStorage.getItem('a2048hi')||0),over=false,anim=[],prev=null;
const COLORS={2:'#3d365f',4:'#4a3f78',8:'#7c3aed',16:'#a855f7',32:'#d946ef',64:'#f472b6',128:'#fb7185',256:'#fb923c',512:'#facc15',1024:'#a3e635',2048:'#22d3ee'};
document.getElementById('hi').textContent=hi;

function newGame(){tiles=Array(16).fill(0);score=0;over=false;prev=null;document.querySelector('.over')?.remove();spawn();spawn();draw();ArcadeAudio.bgm('chill');}
function spawn(){const empty=tiles.map((v,i)=>v?-1:i).filter(i=>i>=0);if(!empty.length)return;tiles[empty[Math.random()*empty.length|0]]=Math.random()<0.9?2:4;}
function pos(i){const b=board.clientWidth-16,g=8,s=(b-g*3)/4;const x=i%4,y=i/4|0;return{x:8+x*(s+g),y:8+y*(s+g),size:s};}
function draw(){
  anim.forEach(t=>t.remove());anim=[];
  document.getElementById('score').textContent=score;
  tiles.forEach((v,i)=>{ if(!v)return; const p=pos(i);
    const t=document.createElement('div');t.className='tile';t.textContent=v;
    const fs=v<100?p.size*.42:v<1000?p.size*.34:p.size*.26;
    t.style.cssText=`left:${p.x}px;top:${p.y}px;width:${p.size}px;height:${p.size}px;font-size:${fs}px;background:${COLORS[v]||'#22d3ee'};color:${v<=4?'#cbd5f5':'#0d0b1e'};box-shadow:0 0 ${v>=128?14:0}px ${COLORS[v]||'#22d3ee'}`;
    board.appendChild(t);anim.push(t);});
}
function move(dir){
  if(over)return;
  const before=tiles.join(',');
  // 取出每个方向下的 4 条线（按移动顺序排列）
  let lines=[];
  for(let r=0;r<4;r++){
    const line=[];
    for(let k=0;k<4;k++){
      let i;
      if(dir==='l')i=r*4+k; else if(dir==='r')i=r*4+3-k;
      else if(dir==='u')i=k*4+r; else i=(3-k)*4+r;
      line.push(i);
    }
    lines.push(line);
  }
  lines.forEach(line=>{
    let vals=line.map(i=>tiles[i]).filter(Boolean);
    for(let i=0;i<vals.length-1;i++){
      if(vals[i]===vals[i+1]){vals[i]*=2;score+=vals[i];vals.splice(i+1,1);ArcadeAudio.sfx(vals[i]>=128?'levelup':'merge');}
    }
    while(vals.length<4)vals.push(0);
    line.forEach((i,k)=>tiles[i]=vals[k]);
  });
  if(tiles.join(',')!==before){
    ArcadeAudio.sfx('move');
    // 存档供撤销（不含本步 spawn）
    prev={tiles:tiles.slice(),score};
    spawn();draw();
    if(tiles.includes(2048))ArcadeAudio.sfx('win');
    if(score>hi){hi=score;localStorage.setItem('a2048hi',hi);document.getElementById('hi').textContent=hi;}
    if(!canMove())gameOver();
  }
}
document.querySelector('.undo').addEventListener('click',()=>{
  if(!prev)return;
  ArcadeAudio.sfx('flip');
  tiles=prev.tiles;score=prev.score;over=false;
  document.querySelector('.over')?.remove();
  prev=null;draw();
});
function canMove(){
  if(tiles.includes(0))return true;
  for(let r=0;r<4;r++)for(let c=0;c<4;c++){
    const v=tiles[r*4+c];
    if(c<3&&tiles[r*4+c+1]===v)return true;
    if(r<3&&tiles[(r+1)*4+c]===v)return true;
  }
  return false;
}
function gameOver(){
  over=true;
  ArcadeAudio.stopBgm();
  ArcadeAudio.sfx('over');
  ArcadeBridge.submitScore(score);
  const o=document.createElement('div');o.className='over';
  o.innerHTML=`<p>游戏结束！</p><div style="color:#facc15;font-size:24px;font-weight:800">${score}</div><button onclick="newGame()">再来一局</button>`;
  board.appendChild(o);
}
addEventListener('keydown',e=>{
  const map={ArrowLeft:'l',ArrowRight:'r',ArrowUp:'u',ArrowDown:'d',a:'l',d:'r',w:'u',s:'d'};
  if(e.key==='r'||e.key==='R'){newGame();return;}
  const dir=map[e.key];if(dir){e.preventDefault();move(dir);}
});
let ts=null;
addEventListener('touchstart',e=>ts=e.touches[0],{passive:true});
addEventListener('touchend',e=>{
  if(!ts)return;const dx=e.changedTouches[0].clientX-ts.clientX,dy=e.changedTouches[0].clientY-ts.clientY;
  if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;
  move(Math.abs(dx)>Math.abs(dy)?(dx>0?'r':'l'):(dy>0?'d':'u'));ts=null;
},{passive:true});
newGame();
</script>
</body>
</html>
