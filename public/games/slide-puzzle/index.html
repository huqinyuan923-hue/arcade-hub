<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>数字华容道</title>
<script src="/games/_bridge.js"></script>
<script src="/games/_audio.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box;user-select:none;}
  body{background:#0d0b1e;color:#e7e6f5;font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:12px;padding:10px;}
  h1{color:#a3e635;text-shadow:0 0 10px rgba(163,230,53,.7);font-size:24px;letter-spacing:2px;}
  .hud{display:flex;gap:16px;font-size:14px;color:#94a3b8;}
  .hud b{color:#facc15;font-size:17px;}
  #board{position:relative;width:min(92vw,380px);aspect-ratio:1;background:#1a1633;border-radius:12px;padding:8px;}
  .tile{position:absolute;display:flex;align-items:center;justify-content:center;border-radius:10px;font-weight:800;cursor:pointer;transition:left .1s,top .1s;background:linear-gradient(135deg,#4a3f78,#3d365f);box-shadow:0 0 6px rgba(163,230,53,.25);}
  .tile.correct{background:linear-gradient(135deg,#3f6212,#365314);box-shadow:0 0 12px rgba(163,230,53,.5);}
  .modes{display:flex;gap:8px;}
  .modes button{background:rgba(124,58,237,.2);border:1px solid rgba(167,139,250,.5);color:#ddd6fe;border-radius:8px;padding:6px 16px;cursor:pointer;font-size:13px;}
  .modes button.on{border-color:#a3e635;color:#d9f99d;box-shadow:0 0 8px rgba(163,230,53,.4);}
  button.win{background:linear-gradient(135deg,rgba(34,211,238,.2),rgba(167,139,250,.2));border:1px solid #a3e635;color:#d9f99d;padding:8px 22px;border-radius:10px;cursor:pointer;}
  p.tip{color:#64748b;font-size:12px;}
</style>
</head>
<body>
<h1>🧩 数字华容道</h1>
  <div class="hud"><span>步数 <b id="moves">0</b></span><span>时间 <b id="time">0</b>s</span><span>最佳步数 <b id="bestM">--</b></span></div>
<div id="board"></div>
<div class="modes">
  <button data-n="3" class="on">3×3 简单</button>
  <button data-n="4">4×4 普通</button>
  <button data-n="5">5×5 困难</button>
</div>
<p class="tip">点击数字块滑动（也可用方向键移动空格旁的块）· 排成 1,2,3… 即获胜</p>
<script>
const boardEl=document.getElementById('board');
let N=3,tiles,empty,moves,seconds,timer,playing;

function newGame(n){
  N=n||N;
  document.querySelector('button.win')?.remove();
  tiles=Array.from({length:N*N},(_,i)=>(i+1)%(N*N));
  empty=N*N-1;
  moves=0;seconds=0;playing=false;
  clearInterval(timer);
  document.getElementById('moves').textContent=0;
  document.getElementById('time').textContent=0;
  // 逆序数洗牌（保证有解），从已解状态随机走 200 步
  for(let k=0;k<200*N;k++){
    const nb=neighbors(empty);
    const pick=nb[Math.random()*nb.length|0];
    tiles[empty]=tiles[pick];tiles[pick]=0;empty=pick;
  }
  draw();
}
function neighbors(i){
  const x=i%N,y=i/N|0,out=[];
  if(x>0)out.push(i-1);if(x<N-1)out.push(i+1);
  if(y>0)out.push(i-N);if(y<N-1)out.push(i+N);
  return out;
}
function tryMove(i){
  if(!playing)return false;
  if(!neighbors(empty).includes(i))return false;
  tiles[empty]=tiles[i];tiles[i]=0;empty=i;
  moves++;document.getElementById('moves').textContent=moves;
  ArcadeAudio.sfx('move');
  draw();
  if(tiles.every((v,idx)=>(idx===N*N-1)?v===0:v===idx+1))win();
  return true;
}
function startTimer(){
  if(playing)return;
  playing=true;
  timer=setInterval(()=>{seconds++;document.getElementById('time').textContent=seconds;},1000);
}
function win(){
  playing=false;clearInterval(timer);
  ArcadeAudio.stopBgm();
  ArcadeAudio.sfx('win');
  const key='aslidebest'+N;
  const prevBest=+(localStorage.getItem(key)||0);
  if(!prevBest||moves<prevBest){localStorage.setItem(key,moves);document.getElementById('bestM').textContent=moves;}
  const score=Math.max(50,1000-moves*5-seconds*2-N*N*20);
  ArcadeBridge.submitScore(score);
  const b=document.createElement('button');
  b.className='win';
  b.textContent=`🏆 完成！${moves} 步 / ${seconds}s · 得分 ${score} · 点击再来`;
  b.onclick=()=>newGame();
  document.body.appendChild(b);
}
function draw(){
  boardEl.querySelectorAll('.tile').forEach(t=>t.remove());
  const size=boardEl.clientWidth;
  const s=(size-16)/N,g=4;
  tiles.forEach((v,i)=>{
    if(!v)return;
    const t=document.createElement('div');
    t.className='tile';
    t.textContent=v;
    const x=i%N,y=i/N|0;
    t.style.cssText+=`left:${8+x*(s+g)}px;top:${8+y*(s+g)}px;width:${s}px;height:${s}px;font-size:${s*.4}px;`;
    if(v===i+1)t.classList.add('correct');
    t.addEventListener('click',()=>{startTimer();tryMove(i);});
    boardEl.appendChild(t);
  });
}
addEventListener('keydown',e=>{
  // 方向键：移动空格对应方向的块
  const map={ArrowLeft:1,ArrowRight:-1,ArrowDown:N,ArrowUp:-N};
  if(map[e.key]!==undefined){
    e.preventDefault();startTimer();
    const target=empty+map[e.key];
    const xe=empty%N,xt=target%N;
    if((e.key==='ArrowLeft'&&xe===N-1)||(e.key==='ArrowRight'&&xe===0))return;
    if(target>=0&&target<N*N)tryMove(target);
  }
});
document.querySelectorAll('.modes button').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.modes button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');
  newGame(+b.dataset.n);
}));
addEventListener('resize',()=>draw());
(()=>{const b=localStorage.getItem('aslidebest'+N);if(b)document.getElementById('bestM').textContent=b;})();
newGame(3);
ArcadeAudio.bgm('chill');
</script>
</body>
</html>
