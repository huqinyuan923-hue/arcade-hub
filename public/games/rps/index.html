<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>石头剪刀布</title>
<script src="/games/_bridge.js"></script>
<script src="/games/_audio.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box;user-select:none;}
  body{background:#0d0b1e;color:#e7e6f5;font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:14px;padding:10px;}
  h1{color:#a855f7;text-shadow:0 0 10px rgba(168,85,247,.6);font-size:22px;letter-spacing:2px;}
  .hud{display:flex;gap:16px;font-size:14px;color:#94a3b8;}
  .hud b{color:#facc15;font-size:17px;}
  #arena{display:flex;gap:30px;align-items:center;justify-content:center;min-height:110px;}
  .hand{width:100px;height:100px;border-radius:20px;background:#1a1633;border:1px solid rgba(168,85,247,.4);display:flex;align-items:center;justify-content:center;font-size:52px;}
  .hand.winner{border-color:#a3e635;box-shadow:0 0 16px rgba(163,230,53,.5);}
  .vs{font-size:15px;color:#64748b;font-weight:700;}
  .opts{display:flex;gap:12px;}
  .opts button{width:84px;height:84px;font-size:38px;border-radius:18px;cursor:pointer;background:rgba(124,58,237,.2);border:1px solid rgba(167,139,250,.5);transition:transform .08s;}
  .opts button:hover{transform:scale(1.06);border-color:#a855f7;}
  #msg{min-height:24px;font-size:16px;text-align:center;color:#94a3b8;}
  #msg b.win{color:#a3e635;}#msg b.lose{color:#f472b6;}
</style>
</head>
<body>
<h1>✊ 石头剪刀布</h1>
<div class="hud"><span>连胜 <b id="streak">0</b></span><span>最高连胜 <b id="hi">0</b></span><span>战绩 <b id="rec">0胜0负</b></span></div>
<div id="arena">
  <div class="hand" id="you">❓</div>
  <span class="vs">VS</span>
  <div class="hand" id="ai">❓</div>
</div>
<div class="opts">
  <button data-p="rock" title="石头">✊</button>
  <button data-p="scissors" title="剪刀">✌️</button>
  <button data-p="paper" title="布">✋</button>
</div>
<p id="msg">AI 会学习你的出招习惯，出你意想不到的一手 · 点击出招</p>
<script>
const HANDS={rock:'✊',scissors:'✌️',paper:'✋'};
const BEATS={rock:'scissors',scissors:'paper',paper:'rock'};
let streak=0,win=0,lose=0,locked=false;
let hi=+(localStorage.getItem('arpshi')||0);
document.getElementById('hi').textContent=hi;
// 记录玩家历史出招频率，AI 预测你最常出的并克制它
const freq={rock:0,scissors:0,paper:0};
const COUNTER={rock:'paper',scissors:'rock',paper:'scissors'};

function play(p){
  if(locked)return;locked=true;
  // AI 出招：80% 克制你的最高频选择，20% 随机
  const sorted=Object.entries(freq).sort((a,b)=>b[1]-a[1]);
  let ai;
  if(sorted[0][1]>0&&Math.random()<0.8)ai=COUNTER[sorted[0][0]];
  else ai=Object.keys(HANDS)[Math.random()*3|0];
  freq[p]++;
  document.getElementById('you').textContent=HANDS[p];
  const aiEl=document.getElementById('ai');
  // 出招动画
  let flipN=0;
  const flipTimer=setInterval(()=>{
    aiEl.textContent=Object.values(HANDS)[flipN++%3];
    ArcadeAudio.sfx('click');
    if(flipN>5){
      clearInterval(flipTimer);
      aiEl.textContent=HANDS[ai];
      setTimeout(judge,250);
    }
  },80);
  function judge(){
    const msg=document.getElementById('msg');
    document.getElementById('you').classList.remove('winner');
    document.getElementById('ai').classList.remove('winner');
    if(p===ai){
      msg.textContent=`🤝 平局 · 双方都是 ${HANDS[p]}`;
      ArcadeAudio.sfx('move');
    }else if(BEATS[p]===ai){
      streak++;win++;
      msg.innerHTML=`<b class="win">🎉 你赢了！</b> ${HANDS[p]} 克 ${HANDS[ai]} · 连胜 ${streak}`;
      document.getElementById('ai').classList.add('winner');
      ArcadeAudio.sfx(streak>=3?'levelup':'score');
      if(streak>hi){hi=streak;localStorage.setItem('arpshi',hi);document.getElementById('hi').textContent=hi;}
    }else{
      streak=0;lose++;
      msg.innerHTML=`<b class="lose">💦 你输了</b> ${HANDS[ai]} 克 ${HANDS[p]}`;
      document.getElementById('you').classList.add('winner');
      ArcadeAudio.stopBgm();
      ArcadeAudio.sfx('over');
    }
    document.getElementById('streak').textContent=streak;
    document.getElementById('rec').textContent=`${win}胜${lose}负`;
    ArcadeBridge.submitScore(streak*100+win*10);
    locked=false;
  }
}
document.querySelectorAll('.opts button').forEach(b=>b.addEventListener('click',()=>play(b.dataset.p)));
ArcadeAudio.bgm('pulse');
</script>
</body>
</html>
