<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>打字练习</title>
<script src="/games/_bridge.js"></script>
<script src="/games/_audio.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#0d0b1e;color:#e7e6f5;font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:14px;padding:10px;}
  h1{color:#a3e635;text-shadow:0 0 10px rgba(163,230,53,.6);font-size:22px;letter-spacing:2px;}
  .hud{display:flex;gap:16px;font-size:14px;color:#94a3b8;}
  .hud b{color:#facc15;font-size:17px;}
  #text{width:min(94vw,640px);min-height:96px;background:#1a1633;border-radius:12px;border:1px solid rgba(163,230,53,.3);padding:16px;font-size:20px;line-height:1.8;font-family:ui-monospace,monospace;letter-spacing:1px;}
  #text span.done{color:#a3e635;}
  #text span.cur{background:#a3e635;color:#0d0b1e;border-radius:3px;}
  #text span.bad{color:#f87171;}
  input{position:absolute;opacity:0;left:-9999px;}
  button{background:linear-gradient(135deg,rgba(34,211,238,.2),rgba(167,139,250,.2));border:1px solid #a3e635;color:#d9f99d;padding:9px 26px;border-radius:10px;cursor:pointer;font-size:15px;}
  #msg{min-height:22px;font-size:14px;color:#94a3b8;}
</style>
</head>
<body>
<h1>⌨️ 打字练习</h1>
<div class="hud"><span>WPM <b id="wpm">0</b></span><span>正确率 <b id="acc">100%</b></span><span>最高 WPM <b id="hi">0</b></span></div>
<div id="text"></div>
<button id="btnStart">开始（60 秒）</button>
<p id="msg">点击开始后直接打字即可 · 系统自动跟踪光标，无需选中输入框</p>
<input id="hidden">
<script>
const WORDS='the and for are but not you all can had her was one our out day get has him his how man new now old see two way who boy did its let put say she too use with this that have from they will would there their what about which when make like time just know take people into year your good some could them than then look only come over think also back after work first well even want because these give most'.split(' ');
const SENTENCES=['the quick brown fox jumps over the lazy dog','practice makes perfect so keep typing every day','a journey of a thousand miles begins with a single step','actions speak louder than words in every language','do not count the days make the days count instead'];
const textEl=document.getElementById('text'),msg=document.getElementById('msg');
let target,pos,bad,startT,timer,left,running=false;
let hi=+(localStorage.getItem('atypehi')||0);
document.getElementById('hi').textContent=hi;

function newText(){
  target=Array.from({length:8},()=>WORDS[Math.random()*WORDS.length|0]).join(' ');
  // 每关穿插一句名言
  if(Math.random()<0.3)target=SENTENCES[Math.random()*SENTENCES.length|0];
  pos=0;bad=0;
  render();
}
function render(){
  textEl.innerHTML=target.split('').map((ch,i)=>
    i<pos?`<span class="done">${ch}</span>`:i===pos?`<span class="cur">${ch}</span>`:`<span>${ch}</span>`
  ).join('');
}
function start(){
  running=true;startT=Date.now();left=60;
  document.getElementById('wpm').textContent=0;
  document.getElementById('acc').textContent='100%';
  newText();
  document.getElementById('btnStart').textContent='进行中…';
  ArcadeAudio.bgm('pulse');
  timer=setInterval(()=>{
    left--;
    if(left<=0)finish();
    updateHud();
  },1000);
  msg.textContent='开打！打错的字不会前进，会标记为红色';
}
function updateHud(){
  const mins=(Date.now()-startT)/60000;
  const wpm=mins>0?Math.round((pos/5)/mins):0;
  document.getElementById('wpm').textContent=wpm;
  const acc=pos+bad>0?Math.round(pos/(pos+bad)*100):100;
  document.getElementById('acc').textContent=acc+'%';
}
function finish(){
  running=false;clearInterval(timer);
  ArcadeAudio.stopBgm();
  const mins=(Date.now()-startT)/60000;
  const wpm=Math.round((pos/5)/mins);
  if(wpm>hi){hi=wpm;localStorage.setItem('atypehi',hi);document.getElementById('hi').textContent=hi;}
  const acc=pos+bad>0?Math.round(pos/(pos+bad)*100):100;
  const score=Math.max(10,wpm*10*(acc/100|0));
  ArcadeAudio.sfx(wpm>40?'win':'over');
  ArcadeBridge.submitScore(score);
  msg.style.color=wpm>40?'#a3e635':'#f472b6';
  msg.textContent=`⏰ 时间到！WPM ${wpm} · 正确率 ${acc}% · 得分 ${score}`;
  document.getElementById('btnStart').textContent='再来一轮';
}
addEventListener('keydown',e=>{
  if(!running)return;
  if(e.key.length===1||e.key===' '){
    e.preventDefault();
    const expect=target[pos];
    if(e.key===expect){
      pos++;
      ArcadeAudio.sfx('click');
      if(pos>=target.length)newText();
    }else{
      bad++;
      ArcadeAudio.sfx('miss');
    }
    render();
    updateHud();
  }
});
document.getElementById('btnStart').addEventListener('click',start);
newText();
</script>
</body>
</html>
