<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>猜数字</title>
<script src="/games/_bridge.js"></script>
<script src="/games/_audio.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box;user-select:none;}
  body{background:#0d0b1e;color:#e7e6f5;font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:12px;padding:10px;}
  h1{color:#a855f7;text-shadow:0 0 10px rgba(168,85,247,.6);font-size:22px;letter-spacing:2px;}
  .hud{display:flex;gap:16px;font-size:14px;color:#94a3b8;}
  .hud b{color:#facc15;font-size:17px;}
  #stage{width:min(92vw,340px);height:110px;background:#1a1633;border:1px solid rgba(168,85,247,.4);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:36px;font-weight:800;font-family:ui-monospace,monospace;}
  #stage small{font-size:13px;color:#94a3b8;font-weight:400;margin-top:4px;}
  input{background:#221d44;border:1px solid rgba(168,85,247,.4);color:#e7e6f5;border-radius:10px;padding:10px;font-size:22px;font-family:ui-monospace,monospace;text-align:center;width:150px;outline:none;}
  button{background:linear-gradient(135deg,rgba(34,211,238,.2),rgba(167,139,250,.2));border:1px solid #a855f7;color:#e9d5ff;padding:9px 22px;border-radius:10px;cursor:pointer;}
  #log{width:min(92vw,340px);max-height:130px;overflow-y:auto;font-size:13px;color:#94a3b8;display:flex;flex-direction:column;gap:4px;}
  #log div{background:#181430;border-radius:8px;padding:5px 10px;}
  #msg{min-height:22px;font-size:14px;color:#94a3b8;text-align:center;}
</style>
</head>
<body>
<h1>🔮 猜数字</h1>
<div class="hud"><span>剩余机会 <b id="tries">7</b>/7</span><span>连胜 <b id="streak">0</b></span></div>
<div id="stage">1 ~ 100<small>我心里的数字，7 次内猜中它</small></div>
<div style="display:flex;gap:8px;">
  <input id="inp" inputmode="numeric" maxlength="3" autocomplete="off">
  <button id="btnGo">猜！</button>
</div>
<div id="log"></div>
<p id="msg">提示会告诉你大了还是小了 —— 用二分法 7 次必中，看你怎么规划</p>
<script>
const stage=document.getElementById('stage'),inp=document.getElementById('inp'),logEl=document.getElementById('log'),msg=document.getElementById('msg');
let answer,tries,streak=0,over=false;

function newGame(){
  answer=1+Math.random()*100|0;
  tries=7;over=false;
  document.getElementById('tries').textContent=7;
  document.getElementById('stage').innerHTML='1 ~ 100<small>我心里的数字，7 次内猜中它</small>';
  logEl.innerHTML='';
  inp.value='';inp.disabled=false;
  document.getElementById('btnGo').disabled=false;
  inp.focus();
}
function guess(){
  if(over)return;
  const v=+inp.value;
  if(!v||v<1||v>100){msg.style.color='#f87171';msg.textContent='请输入 1~100 的整数';return;}
  tries--;
  document.getElementById('tries').textContent=tries;
  const row=document.createElement('div');
  if(v===answer){
    over=true;streak++;
    document.getElementById('streak').textContent=streak;
    stage.innerHTML=`${answer} 🎉<small>猜中了！</small>`;
    ArcadeAudio.stopBgm();ArcadeAudio.sfx('win');
    const score=tries*100+300;
    ArcadeBridge.submitScore(score);
    msg.style.color='#a3e635';
    msg.textContent=`✅ 就是 ${answer}！剩 ${tries} 次机会 · +${score}`;
    inp.disabled=true;document.getElementById('btnGo').disabled=true;
    setTimeout(newGame,2000);
    return;
  }else if(v<answer){
    row.textContent=`${v} → 太小了 ↑`;
    stage.innerHTML=`${v} ❌<small>比这大</small>`;
    ArcadeAudio.sfx('move');
  }else{
    row.textContent=`${v} → 太大了 ↓`;
    stage.innerHTML=`${v} ❌<small>比这小</small>`;
    ArcadeAudio.sfx('move');
  }
  logEl.prepend(row);
  inp.value='';
  if(tries<=0){
    over=true;streak=0;
    document.getElementById('streak').textContent=0;
    stage.innerHTML=`${answer} 💀<small>机会用完了</small>`;
    ArcadeAudio.stopBgm();ArcadeAudio.sfx('over');
    ArcadeBridge.submitScore(10);
    msg.style.color='#f472b6';
    msg.textContent=`答案是 ${answer} · 再来一局`;
    inp.disabled=true;document.getElementById('btnGo').disabled=true;
    setTimeout(newGame,2200);
  }
}
document.getElementById('btnGo').addEventListener('click',guess);
inp.addEventListener('keydown',e=>{if(e.key==='Enter')guess();});
newGame();
ArcadeAudio.bgm('dream');
</script>
</body>
</html>
