<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>五子棋 · 人机对战</title>
<script src="/games/_bridge.js"></script>
<script src="/games/_audio.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box;user-select:none;}
  body{background:#0d0b1e;color:#e7e6f5;font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:12px;padding:10px;}
  h1{color:#22d3ee;text-shadow:0 0 10px rgba(34,211,238,.7);font-size:22px;letter-spacing:2px;}
  .hud{display:flex;gap:16px;font-size:14px;color:#94a3b8;align-items:center;}
  .hud b{color:#facc15;font-size:17px;}
  canvas{background:#b48a5a;border-radius:10px;max-width:92vw;cursor:pointer;}
  .diff{display:flex;gap:8px;}
  .diff button{background:rgba(124,58,237,.2);border:1px solid rgba(167,139,250,.5);color:#ddd6fe;border-radius:8px;padding:6px 14px;cursor:pointer;font-size:13px;}
  .diff button.on{border-color:#22d3ee;color:#d9fbff;box-shadow:0 0 8px rgba(34,211,238,.4);}
  #status{font-size:15px;color:#94a3b8;min-height:22px;}
  button.restart{background:linear-gradient(135deg,rgba(34,211,238,.2),rgba(167,139,250,.2));border:1px solid #22d3ee;color:#d9fbff;padding:8px 20px;border-radius:10px;cursor:pointer;}
</style>
</head>
<body>
<h1>⚫ 五子棋 · 人机对战</h1>
<div class="hud"><span>你 ⚪ / AI ⚫</span><span>连胜 <b id="streak">0</b></span></div>
<canvas id="cv" width="465" height="465"></canvas>
<p id="status">你执白先行，五子连线即胜</p>
<div class="diff">
  <button data-d="1" class="on">入门</button>
  <button data-d="2">进阶</button>
  <button data-d="3">困难</button>
</div>
<button class="restart">重新开始</button>
<button class="undo" style="background:rgba(124,58,237,.2);border:1px solid rgba(167,139,250,.5);color:#ddd6fe;padding:8px 20px;border-radius:10px;cursor:pointer;">↩ 悔棋</button>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const N=15,PAD=15,CELL=(465-PAD*2)/(N-1);
let board,playing,me=true,winLine,streak=0,level=1,history=[];
const DIRS=[[1,0],[0,1],[1,1],[1,-1]];

function newGame(){
  board=Array.from({length:N},()=>Array(N).fill(0)); // 0空 1黑(AI) 2白(玩家)
  playing=true;me=true;winLine=null;history=[];
  document.getElementById('status').textContent='你执白先行，五子连线即胜';
  draw();
}
function at(x,y){return x<0||x>=N||y<0||y>=N?0:board[y][x];}
function place(x,y,p){
  board[y][x]=p;
  history.push({x,y,p});
  ArcadeAudio.sfx('click');
  draw();
  const w=checkWin(x,y,p);
  if(w){winLine=w;playing=false;finish(p===2);return true;}
  return false;
}
function undo(){
  if(!history.length)return;
  if(!me&&playing)return; // AI 思考中不允许悔棋
  // 轮到玩家时撤两步（AI+自己）；终局后撤一步重新开始
  const steps=playing?2:1;
  let n=steps;
  while(n--&&history.length){
    const m=history.pop();
    board[m.y][m.x]=0;
  }
  ArcadeAudio.sfx('flip');
  playing=true;me=true;winLine=null;
  document.getElementById('status').textContent='已悔棋，轮到你（⚪）';
  draw();
}
function checkWin(x,y,p){
  for(const [dx,dy] of DIRS){
    const line=[[x,y]];
    for(const s of [1,-1]){
      let nx=x+dx*s,ny=y+dy*s;
      while(at(nx,ny)===p){line.push([nx,ny]);nx+=dx*s;ny+=dy*s;}
    }
    if(line.length>=5)return line;
  }
  return null;
}
function finish(playerWon){
  ArcadeAudio.stopBgm();
  ArcadeAudio.sfx(playerWon?'win':'over');
  if(playerWon){streak++;}else{streak=0;}
  document.getElementById('streak').textContent=streak;
  const score=playerWon?100+streak*50+level*20:20;
  ArcadeBridge.submitScore(score);
  document.getElementById('status').textContent=playerWon
    ?`🏆 你赢了！+${score}，连胜 ${streak}`
    :'🤖 AI 赢了，再接再厉';
  draw();
}
// —— 评分式 AI：对每个空位计算攻防分 ——
function lineScore(p,emptyBefore,emptyAfter){
  return 0;
}
function scoreMove(x,y,p){
  let total=0;
  for(const [dx,dy] of DIRS){
    let cnt=1,block=0;
    for(const s of [1,-1]){
      let nx=x+dx*s,ny=y+dy*s;
      while(at(nx,ny)===p){cnt++;nx+=dx*s;ny+=dy*s;}
      if(at(nx,ny)===0)continue;else block++;
    }
    total+=[0,1,10,100,1000,100000][Math.min(5,cnt)]*(block>=2?0.3:1);
  }
  return total;
}
function aiMove(){
  // 找最高分：己方进攻分 + 对方威胁分（按难度加权）
  let best=[],bestV=-1;
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    if(at(x,y))continue;
    const atk=scoreMove(x,y,1);
    const def=scoreMove(x,y,2);
    // 立即取胜 > 必须防守 > 攻防综合分（难度决定防守权重）
    const vv=atk>=100000?1e9:def>=100000?1e8:atk+def*(level===1?0.5:level===2?0.9:1.5);
    if(vv>bestV){bestV=vv;best=[x,y];}
  }
  const [x,y]=best.length?best:[7,7];
  place(x,y,1);
  if(playing)document.getElementById('status').textContent='轮到你了（⚪）';
}
cv.addEventListener('click',e=>{
  if(!playing||!me)return;
  const r=cv.getBoundingClientRect();
  const gx=Math.round(((e.clientX-r.left)*(cv.width/r.width)-PAD)/CELL);
  const gy=Math.round(((e.clientY-r.top)*(cv.height/r.height)-PAD)/CELL);
  if(gx<0||gx>=N||gy<0||gy>=N||at(gx,gy))return;
  if(place(gx,gy,2))return;
  me=false;
  document.getElementById('status').textContent='🤖 AI 思考中…';
  setTimeout(()=>{aiMove();me=true;},300);
});
document.querySelectorAll('.diff button').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.diff button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');level=+b.dataset.d;
  ArcadeAudio.sfx('move');
}));
document.querySelector('.restart').addEventListener('click',()=>{ArcadeAudio.sfx('move');newGame();});
document.querySelector('.undo').addEventListener('click',undo);
function draw(){
  ctx.fillStyle='#b48a5a';ctx.fillRect(0,0,cv.width,cv.height);
  ctx.strokeStyle='rgba(60,30,10,.6)';ctx.lineWidth=1;
  for(let i=0;i<N;i++){
    ctx.beginPath();ctx.moveTo(PAD+i*CELL,PAD);ctx.lineTo(PAD+i*CELL,cv.height-PAD);ctx.stroke();
    ctx.beginPath();ctx.moveTo(PAD,PAD+i*CELL);ctx.lineTo(cv.width-PAD,PAD+i*CELL);ctx.stroke();
  }
  // 天元与星位
  [[7,7],[3,3],[11,3],[3,11],[11,11]].forEach(([x,y])=>{
    ctx.beginPath();ctx.arc(PAD+x*CELL,PAD+y*CELL,3,0,7);ctx.fillStyle='rgba(60,30,10,.8)';ctx.fill();
  });
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    const p=at(x,y);
    if(!p)continue;
    const cx=PAD+x*CELL,cy=PAD+y*CELL,r=CELL/2-1.5;
    const grad=ctx.createRadialGradient(cx-2,cy-2,1,cx,cy,r);
    if(p===1){grad.addColorStop(0,'#555');grad.addColorStop(1,'#111');}
    else{grad.addColorStop(0,'#fff');grad.addColorStop(1,'#bbb');}
    ctx.beginPath();ctx.arc(cx,cy,r,0,7);ctx.fillStyle=grad;ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,.4)';ctx.stroke();
  }
  if(winLine){
    const [sx,sy]=winLine[0],[ex,ey]=winLine[winLine.length-1];
    ctx.strokeStyle='rgba(163,230,53,.9)';ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(PAD+sx*CELL,PAD+sy*CELL);ctx.lineTo(PAD+ex*CELL,PAD+ey*CELL);ctx.stroke();
  }
}
newGame();
ArcadeAudio.bgm('dream');
</script>
</body>
</html>
